# latprobe + Prometheus + Grafana.
#   docker compose up -d --build
#   latprobe:   http://localhost:9310/metrics
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000  (anonymous viewer; admin/admin)
services:
  latprobe:
    build: .
    image: latprobe:local
    command: ["serve", "-c", "/etc/latprobe/config.yaml", "--listen", ":9310", "--log-format", "json"]
    volumes:
      - ./examples/config.yaml:/etc/latprobe/config.yaml:ro
    ports:
      - "9310:9310"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on: [latprobe]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped
