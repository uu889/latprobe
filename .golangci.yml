version: "2"
linters:
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
  settings:
    errcheck:
      # Writes to stdout/tabwriter: the final Flush error is what matters.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck]
